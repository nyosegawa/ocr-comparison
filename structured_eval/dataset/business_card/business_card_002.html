<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=346, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 346px;
    height: 210px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: #ffffff;
    border: 1px solid #cccccc;
  }
  .outer-frame {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 24px;
  }
  .top-line {
    width: 60px;
    height: 1px;
    background: #999999;
    margin-bottom: 12px;
  }
  .company-name {
    font-size: 9px;
    font-weight: 300;
    color: #555555;
    text-align: center;
    letter-spacing: 0.12em;
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .title-line {
    font-size: 8px;
    font-weight: 300;
    color: #888888;
    text-align: center;
    letter-spacing: 0.15em;
    margin-bottom: 10px;
  }
  .divider {
    width: 40px;
    height: 1px;
    background: #cccccc;
    margin-bottom: 10px;
  }
  .name-reading {
    font-size: 7.5px;
    font-weight: 300;
    color: #aaaaaa;
    text-align: center;
    letter-spacing: 0.2em;
    margin-bottom: 3px;
  }
  .person-name {
    font-size: 26px;
    font-weight: 300;
    color: #111111;
    text-align: center;
    letter-spacing: 0.1em;
    line-height: 1.0;
    margin-bottom: 12px;
  }
  .bottom-divider {
    width: 100px;
    height: 1px;
    background: #cccccc;
    margin-bottom: 10px;
  }
  .contact-block {
    text-align: center;
  }
  .contact-row {
    font-size: 8px;
    font-weight: 300;
    color: #555555;
    letter-spacing: 0.05em;
    line-height: 1.7;
  }
  .bottom-line {
    width: 60px;
    height: 1px;
    background: #999999;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="outer-frame">
    <div class="top-line"></div>
    <div class="company-name">医療法人社団 橘クリニック</div>
    <div class="title-line">院長</div>
    <div class="divider"></div>
    <div class="name-reading">やまもと けいこ</div>
    <div class="person-name">山本 恵子</div>
    <div class="bottom-divider"></div>
    <div class="contact-block">
      <div class="contact-row">愛媛県松山市三番町5丁目12-3</div>
      <div class="contact-row">TEL&nbsp;&nbsp;089-921-4455</div>
    </div>
    <div class="bottom-line"></div>
  </div>
</body>
</html>
