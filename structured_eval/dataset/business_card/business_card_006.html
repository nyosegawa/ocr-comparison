<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=346, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 346px;
    height: 210px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: #ffffff;
    border: 1.5px dashed #888888;
  }
  .card-inner {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 24px;
  }
  .company-name {
    font-size: 11px;
    font-weight: 700;
    color: #222222;
    letter-spacing: 0.06em;
    text-align: center;
    margin-bottom: 6px;
  }
  .divider {
    width: 60px;
    height: 1px;
    background: #aaaaaa;
    margin: 0 auto 10px;
  }
  .title-text {
    font-size: 8.5px;
    color: #555555;
    font-weight: 400;
    text-align: center;
    letter-spacing: 0.08em;
    margin-bottom: 18px;
  }
  .name-reading {
    font-size: 8px;
    color: #999999;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-align: center;
    margin-bottom: 4px;
  }
  .person-name {
    font-size: 28px;
    font-weight: 700;
    color: #111111;
    letter-spacing: 0.1em;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 18px;
  }
  .divider2 {
    width: 40px;
    height: 1px;
    border-top: 1px dashed #aaaaaa;
    margin: 0 auto 12px;
  }
  .phone-row {
    font-size: 9px;
    color: #333333;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-align: center;
  }
  .phone-label {
    font-size: 7px;
    color: #888888;
    font-weight: 300;
    letter-spacing: 0.06em;
    margin-right: 4px;
  }
</style>
</head>
<body>
  <div class="card-inner">
    <div class="company-name">有限会社みちのく雑貨店</div>
    <div class="divider"></div>
    <div class="title-text">店長</div>
    <div class="name-reading">いとう さくら</div>
    <div class="person-name">伊藤 さくら</div>
    <div class="divider2"></div>
    <div class="phone-row">
      <span class="phone-label">TEL</span>019-624-3870
    </div>
  </div>
</body>
</html>
