<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=346, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 346px;
    height: 210px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: #fdf8f2;
  }
  .card-inner {
    width: 346px;
    height: 210px;
    display: flex;
    flex-direction: column;
  }
  .top-strip {
    height: 5px;
    background: linear-gradient(90deg, #8b5e3c 0%, #c4924a 50%, #8b5e3c 100%);
  }
  .split-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 9px 14px 7px 14px;
    border-bottom: 1px solid #d4b896;
  }
  .header-left .company-ja {
    font-size: 10px;
    font-weight: 700;
    color: #5c3d1e;
    letter-spacing: 0.04em;
  }
  .header-left .company-en {
    font-size: 7px;
    font-weight: 300;
    color: #8b6a48;
    letter-spacing: 0.06em;
    margin-top: 1px;
  }
  .header-right {
    text-align: right;
  }
  .header-right .dept {
    font-size: 7.5px;
    color: #8b6a48;
    font-weight: 400;
    letter-spacing: 0.04em;
  }
  .header-right .title {
    font-size: 8px;
    color: #5c3d1e;
    font-weight: 700;
    margin-top: 1px;
    letter-spacing: 0.04em;
  }
  .body-area {
    display: flex;
    flex: 1;
  }
  .name-area {
    width: 152px;
    padding: 10px 10px 8px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .name-reading {
    font-size: 7.5px;
    color: #a07850;
    font-weight: 300;
    letter-spacing: 0.15em;
    margin-bottom: 2px;
  }
  .person-name {
    font-size: 22px;
    font-weight: 700;
    color: #3a2010;
    letter-spacing: 0.06em;
    line-height: 1.1;
  }
  .ornament {
    margin-top: 8px;
    width: 40px;
    height: 1px;
    background: #c4924a;
  }
  .divider {
    width: 1px;
    background: #d4b896;
    margin: 10px 0;
  }
  .contact-area {
    flex: 1;
    padding: 8px 12px 8px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .contact-row {
    display: flex;
    align-items: flex-start;
    margin-bottom: 3px;
  }
  .label {
    font-size: 7px;
    color: #8b5e3c;
    font-weight: 700;
    min-width: 26px;
    padding-top: 0.5px;
    letter-spacing: 0.02em;
  }
  .value {
    font-size: 7.5px;
    color: #3a2a1a;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1.4;
  }
  .value.small {
    font-size: 6.5px;
  }
  .bottom-strip {
    height: 5px;
    background: linear-gradient(90deg, #8b5e3c 0%, #c4924a 50%, #8b5e3c 100%);
  }
</style>
</head>
<body>
  <div class="card-inner">
    <div class="top-strip"></div>
    <div class="split-header">
      <div class="header-left">
        <div class="company-ja">株式会社四国ハウジング</div>
        <div class="company-en">Shikoku Housing Co., Ltd.</div>
      </div>
      <div class="header-right">
        <div class="dept">開発企画部</div>
        <div class="title">部長</div>
      </div>
    </div>
    <div class="body-area">
      <div class="name-area">
        <div class="name-reading">なかむら ようすけ</div>
        <div class="person-name">中村 陽介</div>
        <div class="ornament"></div>
      </div>
      <div class="divider"></div>
      <div class="contact-area">
        <div class="contact-row">
          <span class="label">〒</span>
          <span class="value">760-0033</span>
        </div>
        <div class="contact-row">
          <span class="label">住所</span>
          <span class="value small">香川県高松市丸の内1丁目3-2<br>高松センタービル10F</span>
        </div>
        <div class="contact-row">
          <span class="label">TEL</span>
          <span class="value">087-822-5670</span>
        </div>
        <div class="contact-row">
          <span class="label">FAX</span>
          <span class="value">087-822-5671</span>
        </div>
        <div class="contact-row">
          <span class="label">携帯</span>
          <span class="value">080-2241-3388</span>
        </div>
        <div class="contact-row">
          <span class="label">Mail</span>
          <span class="value small">yosuke.nakamura@shikoku-housing.co.jp</span>
        </div>
        <div class="contact-row">
          <span class="label">Web</span>
          <span class="value small">https://www.shikoku-housing.co.jp</span>
        </div>
      </div>
    </div>
    <div class="bottom-strip"></div>
  </div>
</body>
</html>
