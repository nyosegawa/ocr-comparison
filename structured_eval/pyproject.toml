[project]
name = "structured-eval"
version = "0.1.0"
description = "Structured output evaluation for VLM document extraction"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "rapidfuzz>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=10.0",
    "Jinja2>=3.0",
    "anthropic>=0.50",
    "openai>=1.50",
    "google-genai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]
render = ["playwright>=1.40"]

[project.scripts]
structured-eval = "src.evaluate:main"
