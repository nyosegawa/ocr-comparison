[project]
name = "ocr-evaluation"
version = "0.1.0"
description = "OCR model evaluation framework using annotation tool ground truth"
requires-python = ">=3.10"
dependencies = [
    "jiwer>=3.0",
    "rapidfuzz>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=10.0",
    "anthropic>=0.50",
    "openai>=1.50",
    "google-genai>=1.0",
    "google-cloud-vision>=3.7",
    "mistralai>=1.0",
    "httpx>=0.27",
    "azure-ai-vision-imageanalysis>=1.0",
    "dashscope>=1.25.14",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
ocr-eval = "src.evaluate:main"
